  <script>
    // 01. Initialize Lucide Icons
    lucide.createIcons();

    // 02. Ambient Starfield & Signal Telemetry Canvas Animation
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = [];
      const numStars = Math.floor((canvas.width * canvas.height) / 6000);
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.3 + 0.3,
          alpha: Math.random() * 0.7 + 0.1,
          speed: Math.random() * 0.006 + 0.002
        });
      }
    }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += Math.sin(Date.now() * star.speed) * 0.01;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
    resizeCanvas();
    initStars();
    animateStars();

    // 03. Interactive 11-Layer Operating System Visualizer
    const osLayers = [
      { num: "01", name: "Experience Layer", desc: "Multi-channel user interfaces including Web Apps, WhatsApp, Voice Streams, and Mobile Touchpoints.", items: ["Websites", "WhatsApp", "Voice API", "Custom Portals"] },
      { num: "02", name: "Identity & Security", desc: "Governance, enterprise authentication, role-based controls, and voiceprint verification.", items: ["OAuth2", "Voiceprint Auth", "RBAC Security", "Audit Logs"] },
      { num: "03", name: "Data Layer", desc: "Structured and unstructured data repositories capturing customer interactions and company records.", items: ["Supabase", "PostgreSQL", "Vector Stores", "Redis"] },
      { num: "04", name: "Knowledge Layer", desc: "Dynamic Retrieval-Augmented Generation (RAG) querying internal docs and live knowledge bases.", items: ["Drive Docs", "Internal FAQs", "API Docs", "Notion DB"] },
      { num: "05", name: "Intelligence Layer", desc: "Advanced LLM reasoning engine evaluating intent, emotion, sentiment, and context.", items: ["Gemini LLMs", "Custom Models", "Sentiment Classifiers"] },
      { num: "06", name: "AI Agents Layer", desc: "Autonomous digital workers executing specialized tasks (Lead Enrichment, Voice Support, Negotiation).", items: ["Lead Enrichment Agent", "Voice Agent", "WhatsApp Agent", "SDR Agent"] },
      { num: "07", name: "Orchestration Layer", desc: "State management, workflow logic routing, and multi-agent coordination frameworks.", items: ["n8n", "LangGraph", "Custom Routers", "Event Bus"] },
      { num: "08", name: "Business Logic Layer", desc: "Custom business rules, compliance guardrails, refund limits, and approval policies.", items: ["Compliance Rules", "Refund Caps", "SLA Monitors"] },
      { num: "09", name: "Actions & Integrations", desc: "Bi-directional API connectors executing operational changes across enterprise software.", items: ["Google Workspace", "CRMs", "Gmail", "Payment APIs"] },
      { num: "10", name: "Analytics & Observability", desc: "Real-time telemetry, token optimization, latency tracking, and conversion analytics.", items: ["Latency Metrics", "CSAT Telemetry", "Cost Trackers"] },
      { num: "11", name: "Evolution Layer", desc: "Continuous feedback loops retraining prompts and refining agent behavior based on real outcomes.", items: ["RLHF Feedback", "Prompt Versioning", "Outcome Logs"] }
    ];

    const selectorRoot = document.getElementById('layer-selector-root');
    const displayRoot = document.getElementById('layer-display-root');

    function renderLayers(activeIndex = 5) { // Default active: Layer 06 (AI Agents Layer)
      selectorRoot.innerHTML = osLayers.map((layer, index) => `
        <div class="layer-item ${index === activeIndex ? 'active' : ''}" onclick="renderLayers(${index})">
          <div style="display: flex; align-items: center; gap: 14px;">
            <span class="layer-num">${layer.num}</span>
            <span class="layer-name">${layer.name}</span>
          </div>
          <i data-lucide="chevron-right" size="14" style="color: var(--text-muted);"></i>
        </div>
      `).join('');

      const active = osLayers[activeIndex];
      displayRoot.innerHTML = `
        <div>
          <div class="tag tag-cyan"><span class="tag-dot"></span> Layer ${active.num} Visualization</div>
          <h3 style="font-size: 26px; font-weight: 700; font-family: var(--font-heading); margin-bottom: 12px;">${active.name}</h3>
          <p style="color: var(--text-secondary); font-size: 15px; line-height: 1.6;">${active.desc}</p>
        </div>
        <div>
          <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 12px;">Supported Connected Technologies</div>
          <div class="integration-pills">
            ${active.items.map(item => `<span class="chip">${item}</span>`).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    renderLayers(5);

    }

      }
